<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campo minado</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!--
    ESQUELETO DA TELA (contrato da seção 3 do PLANEJAMENTO.md).
    Elementos fixos, VAZIOS: sem texto, sem valor e sem atributos de estado
    (data-estado, disabled, hidden). Os testes abrem este HTML.
    O jogo (js/main.js) preenche esses elementos ao abrir a página.
  -->
  <h1>Campo minado</h1>
  <header>
    <span>Minas: <span data-testid="contador-minas"></span></span>
    <button data-testid="btn-reiniciar"></button>
    <span>Tempo: <span data-testid="cronometro"></span> s</span>
  </header>
  <main>
    <div data-testid="tabuleiro"></div>
  </main>
  <footer>
    <p data-testid="mensagem"></p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
